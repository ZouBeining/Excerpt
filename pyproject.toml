[project]
name = "excerpt"
version = "0.1.1"
description = "Extract bolded words from a Markdown file, look them up in a dictionary (or complete them with an LLM), and render a LaTeX vocabulary handout."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "lemminflect>=0.2.2",
    "openai>=1.54.0",
]

[project.scripts]
excerpt = "excerpt.cli:main"
excerpt-latex = "excerpt.latex:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["excerpt", "lookup", "common"]
